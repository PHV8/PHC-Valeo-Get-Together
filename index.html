<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1f3a">
<title>2026 PHC Valeo Get-Together</title>
<style>
  html,body{margin:0;height:100%;background:#0f1f3a;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f5f9}
  #fb{position:fixed;left:0;right:0;bottom:0;padding:10px;text-align:center;font:13px/1.4 -apple-system,"Noto Sans KR",sans-serif;color:#fff;background:rgba(15,31,58,.92);display:none}
  #fb a{color:#9be15d;font-weight:700}
</style>
</head>
<body>
<!-- ▼▼ Paste the web app address (…/exec) between the quotes ▼▼ -->
<script>var APP_URL = "https://script.google.com/macros/s/AKfycbyIsdN3s-ygtomH9VWQSfY7O1JRD9TKQLV0dV9igmN9RO0Q_ooNFwqLDwgC7STvAhsLWw/exec";</script>
<!-- ▲▲ ------------------------------------------------------ ▲▲ -->
<iframe id="app" title="2026 PHC Valeo Get-Together" allow="clipboard-write; fullscreen"></iframe>
<div id="fb">Not loading? <a id="fbl" target="_top">Open the app directly</a></div>
<script>
  // pass ?lang=… etc. through to the app
  var src = APP_URL + (location.search ? (APP_URL.indexOf("?") < 0 ? "?" : "&") + location.search.slice(1) : "");
  var f = document.getElementById("app"), shown = false;
  f.src = src; document.getElementById("fbl").href = src;
  f.onload = function(){ shown = true; };
  setTimeout(function(){ if(!shown) document.getElementById("fb").style.display = "block"; }, 12000);
</script>
</body>
</html>
